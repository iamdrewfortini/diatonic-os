apiVersion: apps/v1
kind: Deployment
metadata:
  name: diatonic-showcase-web
  labels:
    app.kubernetes.io/name: diatonic-showcase-web
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diatonic-showcase-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diatonic-showcase-web
    spec:
      priorityClassName: diatonic-demo-low
      nodeSelector:
        chromatixstudios.com/public-host: node1
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 64Mi
              ephemeral-storage: 128Mi
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: assets
          configMap:
            name: static-assets
            defaultMode: 0444
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: diatonic-showcase
  labels:
    app.kubernetes.io/name: diatonic-showcase-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: diatonic-showcase-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
