apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: diatonic-showcase
resources:
  - namespace.yaml
  - network-policy.yaml
  - workload.yaml
configMapGenerator:
  - name: static-assets
    files:
      - assets/index.html
      - assets/style.css
      - assets/app.mjs
      - assets/core.mjs
  - name: nginx-config
    files:
      - nginx.conf
