stages: [verify, package]
variables:
  GIT_SUBMODULE_STRATEGY: none
showcase-verify:
  image: node:24-bookworm-slim
  stage: verify
  tags: [k8s]
  script:
    - npm test
    - npm run check
showcase-browser:
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  stage: verify
  tags: [k8s]
  script:
    - npm ci
    - npm run test:browser
  artifacts:
    when: always
    paths: [test-results/, playwright-report/]
showcase-package:
  image: alpine:3.22
  stage: package
  tags: [k8s]
  script:
    - tar -czf diatonic-os-showcase.tar.gz showcase docs README.md LICENSE.md SECURITY.md
  artifacts:
    paths: [diatonic-os-showcase.tar.gz]

showcase-nginx:
  stage: verify
  tags: [diatonic-public]
  image:
    name: docker.io/nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    entrypoint: [""]
  script:
    - nginx -t -c "$CI_PROJECT_DIR/deploy/showcase/nginx.conf"
